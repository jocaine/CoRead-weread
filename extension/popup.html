<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  body { width: 280px; font: 13px/1.5 -apple-system,sans-serif; margin: 0; padding: 12px; color: #333; }
  /* AI-019：与侧栏一致的细滚动条（#log 用） */
  *::-webkit-scrollbar { width: 6px; height: 6px; }
  *::-webkit-scrollbar-track { background: transparent; }
  *::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.14); border-radius: 3px; }
  *::-webkit-scrollbar-thumb:hover { background: rgba(0,0,0,0.28); }
  /* Firefox 兜底（Chromium 走 webkit 6px，标准属性 thin 会覆盖成 10px） */
  @-moz-document url-prefix() {
    * { scrollbar-width: thin; scrollbar-color: rgba(0,0,0,0.14) transparent; }
  }
  h3 { margin: 0 0 8px; font-size: 14px; color: #07c160; }
  #status { font-size: 12px; color: #888; margin-bottom: 8px; }
  #log { font-size: 12px; color: #555; max-height: 200px; overflow-y: auto; }
  .entry { border-bottom: 1px solid #f0f0f0; padding: 6px 0; }
  .entry .book { color: #555; font-size: 11px; font-weight: 600; }
  .entry .text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
</style>
</head>
<body>
<h3>CoRead</h3>
<div id="status">正在检查 CoRead 本机服务…</div>
<div id="log"></div>
<script src="popup.js"></script>
</body>
</html>
