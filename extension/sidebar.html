<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>CoRead 共读</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', sans-serif;
      font-size: 14px;
      background: #f5f5f5;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    #header {
      background: #fff;
      border-bottom: 1px solid #ececec;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }
    #header .title { font-weight: 400; font-size: 12px; color: #888; flex: 1; letter-spacing: 0.01em; }
    #dot { width: 7px; height: 7px; border-radius: 50%; background: #ddd; flex-shrink: 0; transition: background 0.3s; }
    /* ── 当前引用卡片 ──────────────────────────── */
    #ref-current {
      background: #fff;
      border-bottom: 1px solid #ececec;
      flex-shrink: 0;
      display: none;
    }
    #ref-current.on { display: block; }
    #ref-current.collapsed .rc-body { display: none; }
    #ref-current .rc-head {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 7px 10px 6px 12px;
      font-size: 11px;
      color: #888;
      border-bottom: 1px solid #f0f0f0;
    }
    #ref-current .rc-head .rc-label {
      flex: 1;
      min-width: 0;
      font-weight: 600;
      color: #07c160;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #ref-current .rc-head button {
      flex: 0 0 auto;
      border: 1px solid #ddd;
      background: #fff;
      border-radius: 4px;
      padding: 2px 8px;
      font-size: 11px;
      cursor: pointer;
      color: #666;
      white-space: nowrap;
    }
    #ref-current .rc-head button:hover { background: #f0f0f0; color: #07c160; }
    #ref-current .rc-head .rc-deselect { color: #ccc; border: none; background: none; font-size: 14px; padding: 0 2px; }
    #ref-current .rc-head .rc-deselect:hover { color: #e74c3c; }
    #ref-current .rc-head .rc-del {
      color: #ccc;
      font-size: 12px;
      padding: 2px 5px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    #ref-current .rc-head .rc-del svg { width: 12px; height: 12px; }
    #ref-current .rc-head .rc-del:hover { color: #e74c3c; border-color: #e74c3c; }
    #ref-current .rc-body {
      padding: 8px 12px 10px;
      font-size: 12px;
      color: #444;
      line-height: 1.7;
    }
    #ref-current .rc-body .rc-book {
      font-size: 13px;
      font-weight: 600;
      color: #222;
      line-height: 1.4;
      margin-bottom: 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #ref-current .rc-body .rc-text {
      background: #fafafa;
      padding: 8px 10px;
      border-radius: 6px;
      border-left: 3px solid #07c160;
      margin-bottom: 6px;
    }
    #ref-current .rc-body .rc-meta {
      font-size: 11px;
      color: #888;
      display: flex;
      gap: 10px;
      margin-top: 2px;
    }
    /* 空状态：未选中引用时隐藏详情与操作区，显示居中提示 */
    #ref-current.empty .rc-body { display: none; }
    #rc-empty {
      display: none;
      padding: 10px 12px 12px;
      font-size: 12px;
      color: #aaa;
      text-align: center;
      line-height: 1.6;
    }
    #ref-current.empty #rc-empty { display: block; }

    /* ── 引用列表抽屉 ──────────────────────────── */
    #ref-drawer {
      position: fixed;
      top: 0; right: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.25);
      z-index: 100;
      display: none;
      flex-direction: column;
      align-items: flex-end;
    }
    #ref-drawer.on { display: flex; }
    #ref-drawer .drawer-panel {
      width: 92%;
      max-width: 320px;
      height: 100%;
      background: #fff;
      display: flex;
      flex-direction: column;
      box-shadow: -2px 0 16px rgba(0,0,0,0.12);
    }
    #ref-drawer .drawer-head {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      border-bottom: 1px solid #ececec;
      flex-shrink: 0;
      flex-wrap: wrap;
    }
    #ref-drawer .drawer-head .drawer-title {
      flex: 1;
      font-size: 13px;
      font-weight: 600;
      color: #333;
      min-width: 80px;
    }
    #ref-drawer .drawer-head .drawer-close {
      border: none;
      background: none;
      font-size: 18px;
      cursor: pointer;
      color: #aaa;
      padding: 0 4px;
    }
    #ref-drawer .drawer-head .drawer-close:hover { color: #333; }
    #ref-drawer .drawer-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px 12px;
    }
    #ref-drawer .drawer-item {
      padding: 8px 10px;
      border: 1px solid #eee;
      border-radius: 8px;
      margin-bottom: 6px;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
    }
    #ref-drawer .drawer-item:hover { border-color: #07c160; background: #fafffb; }
    #ref-drawer .drawer-item.sel { border-color: #07c160; background: #f0faf3; }
    #ref-drawer .drawer-item .di-head {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 2px;
    }
    #ref-drawer .drawer-item .di-num {
      font-size: 10px;
      font-weight: 700;
      color: #07c160;
      background: #e8f5e9;
      border-radius: 3px;
      padding: 1px 4px;
      flex-shrink: 0;
    }
    #ref-drawer .drawer-item .di-book {
      font-size: 10px;
      color: #07c160;
      font-weight: 600;
      margin-bottom: 2px;
    }
    #ref-drawer .drawer-item .di-chapter {
      font-size: 10px;
      color: #aaa;
      margin-bottom: 3px;
    }
    #drawer-search {
      width: 100%;
      border: 1px solid #ddd;
      border-radius: 6px;
      padding: 5px 8px;
      font-size: 12px;
      outline: none;
      margin-top: 6px;
      font-family: inherit;
      color: #333;
      background: #fafafa;
    }
    #drawer-search:focus { border-color: #07c160; }
    #ref-drawer .drawer-item .di-text {
      font-size: 12px;
      color: #555;
      line-height: 1.5;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    #ref-drawer .drawer-item.expanded .di-text {
      display: block;
      -webkit-line-clamp: unset;
    }
    #ref-drawer .drawer-item .di-full {
      display: none;
      margin-top: 4px;
      padding-top: 6px;
      border-top: 1px dashed #eee;
      font-size: 12px;
      color: #444;
      line-height: 1.7;
    }
    #ref-drawer .drawer-item.expanded .di-full { display: block; }
    #ref-drawer .drawer-item .di-toggle {
      font-size: 10px;
      color: #07c160;
      cursor: pointer;
      margin-top: 3px;
      display: inline-block;
    }
    #ref-drawer .drawer-item .di-toggle:hover { text-decoration: underline; }
    #ref-drawer .drawer-item .di-actions {
      display: block;
      margin-top: 4px;
      text-align: right;
    }
    #ref-drawer .drawer-item .di-jump-btn {
      border: 1px solid #ddd;
      background: #fff;
      border-radius: 4px;
      padding: 2px 8px;
      font-size: 10px;
      cursor: pointer;
      color: #666;
    }
    #ref-drawer .drawer-item .di-jump-btn:hover { border-color: #07c160; color: #07c160; }
    #ref-drawer .drawer-item .di-del-btn {
      border: 1px solid #ddd;
      background: #fff;
      border-radius: 4px;
      padding: 2px 8px;
      font-size: 10px;
      cursor: pointer;
      color: #bbb;
      margin-left: 4px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    #ref-drawer .drawer-item .di-del-btn svg { width: 11px; height: 11px; }
    #ref-drawer .drawer-item .di-del-btn:hover { border-color: #e74c3c; color: #e74c3c; }

    /* ── 消息区 ────────────────────────────────── */
    #msgs {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    #footer {
      background: #fff;
      border-top: 1px solid #ececec;
      padding: 10px 12px;
      display: flex;
      gap: 8px;
      align-items: flex-end;
      flex-shrink: 0;
    }
    #input {
      flex: 1;
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 13px;
      resize: none;
      outline: none;
      min-height: 36px;
      max-height: 120px;
      line-height: 1.5;
      font-family: inherit;
      color: #333;
      background: #fafafa;
    }
    #send-btn {
      background: #07c160;
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 0 14px;
      cursor: pointer;
      font-size: 13px;
      height: 36px;
      flex-shrink: 0;
      font-family: inherit;
    }
    #send-btn:hover { background: #06ad56; }

    .msg-annotation {
      background: #fff;
      border: 1px solid #e8f5e9;
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 12px;
      color: #555;
      line-height: 1.6;
    }
    .msg-annotation .label { color: #07c160; font-weight: 600; }
    .msg-annotation .quote { margin-top: 6px; color: #555; font-style: italic; line-height: 1.5; }
    .msg-annotation .text { margin-top: 4px; color: #999; font-size: 11px; }
    .msg-annotation .user-note { margin-top: 6px; color: #07c160; font-style: normal; }
    .msg-user { display: flex; justify-content: flex-end; }
    .msg-user .bubble {
      background: #07c160;
      color: #fff;
      border-radius: 14px 14px 2px 14px;
      padding: 9px 13px;
      max-width: 82%;
      font-size: 13px;
      line-height: 1.65;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .msg-assistant { display: flex; justify-content: flex-start; }
    /* 助理气泡中的引用指示条 */
    .msg-assistant.ref-reply { flex-direction: row; align-items: stretch; }
    .msg-assistant.ref-reply .bubble {
      flex: 1;
      border-radius: 0 14px 14px 2px;
      padding: 8px 12px;
    }
    .ref-bar {
      width: auto;
      min-width: 30px;
      max-width: 40px;
      flex-shrink: 0;
      background: #e8f5e9;
      border-radius: 10px 0 0 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 6px 2px;
      gap: 0;
      cursor: pointer;
      overflow: hidden;
    }
    .ref-bar:hover { background: #d4f0d8; }
    .ref-bar .ref-book {
      writing-mode: vertical-lr;
      font-size: 11px;
      color: #07c160;
      font-weight: 600;
      line-height: 1.3;
      flex-shrink: 0;
    }
    .ref-bar .ref-chapter {
      writing-mode: vertical-lr;
      font-size: 9px;
      color: #888;
      margin-top: 6px;
      padding-top: 6px;
      border-top: 1px solid #b7e4c0;
      line-height: 1.3;
      flex-shrink: 0;
    }
    .ref-bar .ref-num {
      font-size: 11px;
      font-weight: 700;
      color: #07c160;
      margin-top: auto;
      flex-shrink: 0;
    }
    .bubble .ref-quote-preview {
      font-size: 11px;
      color: #999;
      padding: 0;
      margin: 0 0 6px 0;
      border-bottom: 1px dashed #eee;
      line-height: 1.4;
      cursor: pointer;
    }
    .bubble .ref-quote-preview:hover { color: #07c160; }
    .msg-assistant .bubble {
      background: #fff;
      border: 1px solid #ececec;
      border-radius: 14px 14px 14px 2px;
      padding: 9px 13px;
      max-width: 88%;
      font-size: 13px;
      line-height: 1.65;
      white-space: pre-wrap;
      word-break: break-word;
      color: #222;
    }
    .msg-thinking { display: flex; justify-content: flex-start; }
    .msg-thinking .bubble {
      background: #fff;
      border: 1px solid #ececec;
      border-radius: 14px 14px 14px 2px;
      padding: 10px 16px;
      font-size: 13px;
      color: #999;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .msg-thinking .dot {
      width: 6px; height: 6px; border-radius: 50%; background: #bbb;
      animation: thinking-bounce 1.2s infinite ease-in-out;
    }
    .msg-thinking .dot:nth-child(2) { animation-delay: 0.2s; }
    .msg-thinking .dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes thinking-bounce {
      0%, 60%, 100% { transform: translateY(0); }
      30% { transform: translateY(-6px); }
    }

    /* ── 删除确认弹窗 ──────────────────────────── */
    /* 扩展页面不能用原生 confirm()（Chrome 压制并恒返回假），用自绘弹窗替代 */
    #confirm-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .35);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }
    #confirm-overlay.on { display: flex; }
    .confirm-box {
      background: #fff;
      border-radius: 12px;
      width: 260px;
      max-width: 85%;
      padding: 18px 16px 14px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, .15);
    }
    .confirm-title { font-size: 14px; font-weight: 600; color: #222; margin-bottom: 8px; text-align: center; }
    .confirm-msg {
      font-size: 12px; color: #666; line-height: 1.6; margin-bottom: 16px;
      text-align: center; word-break: break-word; max-height: 90px; overflow-y: auto;
    }
    .confirm-actions { display: flex; gap: 8px; }
    .confirm-actions button {
      flex: 1;
      border: none;
      border-radius: 6px;
      padding: 7px 0;
      font-size: 13px;
      cursor: pointer;
    }
    .confirm-cancel { background: #f0f0f0; color: #555; }
    .confirm-cancel:hover { background: #e5e5e5; }
    .confirm-ok { background: #e74c3c; color: #fff; }
    .confirm-ok:hover { background: #d43c2f; }
  </style>
</head>
<body>
  <div id="header">
    <span style="font-size:15px;line-height:1">📖</span>
    <span class="title"><em>We read to know we are not alone.</em></span>
    <span id="dot"></span>
  </div>

  <!-- 当前选中的引用卡片 -->
  <div id="ref-current">
    <div class="rc-head">
      <span class="rc-label">📌 当前引用</span>
      <button id="rc-jump-btn" title="跳转到原文">📍</button>
      <button id="rc-jump-back-btn" title="返回跳转前位置" style="display:none">↩</button>
      <button id="rc-switch-btn">切换引用 ▸</button>
      <button id="rc-collapse-btn" title="折叠/展开">▾</button>
      <button class="rc-del" id="rc-del-btn" title="删除引用">🗑</button>
      <button class="rc-deselect" id="rc-deselect-btn" title="取消引用">✕</button>
    </div>
    <div class="rc-body">
      <div class="rc-book" id="rc-book"></div>
      <div class="rc-text" id="rc-text"></div>
      <div class="rc-meta" id="rc-meta"></div>
    </div>
    <div class="rc-empty" id="rc-empty">暂无选中的引用，点上方「切换引用」选择一条划线</div>
  </div>

  <!-- 引用列表抽屉 -->
  <div id="ref-drawer">
    <div class="drawer-panel">
      <div class="drawer-head">
        <span class="drawer-title">全部引用</span>
        <button class="drawer-close" id="drawer-close-btn">✕</button>
        <input type="text" id="drawer-search" placeholder="搜索引用…">
      </div>
      <div class="drawer-list" id="drawer-list"></div>
    </div>
  </div>

  <!-- 删除确认弹窗（替代扩展页不可用的原生 confirm()） -->
  <div id="confirm-overlay">
    <div class="confirm-box">
      <div class="confirm-title" id="confirm-title">删除引用</div>
      <div class="confirm-msg" id="confirm-msg"></div>
      <div class="confirm-actions">
        <button class="confirm-cancel" id="confirm-cancel-btn">取消</button>
        <button class="confirm-ok" id="confirm-ok-btn">确认删除</button>
      </div>
    </div>
  </div>

  <div id="msgs"></div>
  <div id="footer">
    <textarea id="input" placeholder="说点什么…" rows="1"></textarea>
    <button id="send-btn">发送</button>
  </div>
  <script src="sidebar.js"></script>
</body>
</html>
