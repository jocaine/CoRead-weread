<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>pdf.js 文字层 spike</title>
<link rel="stylesheet" href="/extension/vendor/pdfjs/text-layer.css">
<style>
  body { margin: 0; background: #eceff3; font: 13px/1.5 system-ui, sans-serif; }
  #stage { display: flex; gap: 16px; padding: 16px; align-items: flex-start; }
  .page { position: relative; background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.18); }
  .page canvas { display: block; position: relative; z-index: 0; }
  #log { padding: 0 16px 24px; white-space: pre-wrap; font-family: ui-monospace, monospace; }
  ::highlight(spike-hl) { background: rgba(120, 200, 140, .55); }
</style>
</head>
<body>
<div id="stage"></div>
<div id="log">waiting for driver…</div>

<script type="module">
import * as pdfjsLib from '/extension/vendor/pdfjs/pdf.min.mjs'

const SCALE = 1.25
const logEl = document.getElementById('log')

// 由驱动侧调用：全部跑完才 return，驱动拿到结构化结果再截图
window.__selftest = async function () {
  const report = { ok: false, steps: [], errors: [] }
  const say = (m) => { report.steps.push(String(m)); logEl.textContent = report.steps.join('\n') }
  try {
    pdfjsLib.GlobalWorkerOptions.workerSrc = '/extension/vendor/pdfjs/pdf.worker.min.mjs'
    report.pdfjs = pdfjsLib.version
    say('pdf.js 版本 ' + pdfjsLib.version)

    const bytes = new Uint8Array(await (await fetch('/.selftest/sample.pdf')).arrayBuffer())
    say('样本 PDF ' + bytes.length + ' 字节')

    const doc = await pdfjsLib.getDocument({ data: bytes }).promise
    report.numPages = doc.numPages
    say('页数 ' + doc.numPages)

    const stage = document.getElementById('stage')
    const pageTexts = []
    const spansPerPage = []
    const layers = []

    for (let p = 1; p <= doc.numPages; p++) {
      const page = await doc.getPage(p)
      const viewport = page.getViewport({ scale: SCALE })

      const wrap = document.createElement('div')
      wrap.className = 'page'
      wrap.style.width = viewport.width + 'px'
      wrap.style.height = viewport.height + 'px'
      wrap.style.setProperty('--total-scale-factor', String(SCALE))

      const canvas = document.createElement('canvas')
      const dpr = window.devicePixelRatio || 1
      canvas.width = Math.floor(viewport.width * dpr)
      canvas.height = Math.floor(viewport.height * dpr)
      canvas.style.width = viewport.width + 'px'
      canvas.style.height = viewport.height + 'px'
      wrap.appendChild(canvas)

      const layer = document.createElement('div')
      layer.className = 'textLayer'
      wrap.appendChild(layer)
      stage.appendChild(wrap)
      layers.push(layer)

      await page.render({
        canvasContext: canvas.getContext('2d'),
        viewport,
        transform: dpr === 1 ? null : [dpr, 0, 0, dpr, 0, 0],
      }).promise

      const textContent = await page.getTextContent()
      const tl = new pdfjsLib.TextLayer({ textContentSource: textContent, container: layer, viewport })
      await tl.render()

      const spans = [...layer.querySelectorAll('span')]
      const text = spans.map((s) => s.textContent).join('')
      pageTexts.push(text)
      spansPerPage.push(spans.length)
      say(`第 ${p} 页：canvas ${canvas.width}×${canvas.height}，文字层 ${spans.length} span / ${text.length} 字`)
    }

    report.spansPerPage = spansPerPage
    report.textPerPage = pageTexts.map((t) => t)
    report.canvasPixelSize = [...document.querySelectorAll('.page canvas')].map((c) => [c.width, c.height])

    // 1) span 上能不能取出 Range，矩形是否落在画布内
    const firstSpan = document.querySelector('.textLayer span')
    if (firstSpan) {
      const r = firstSpan.getBoundingClientRect()
      const canvasRect = firstSpan.closest('.page').querySelector('canvas').getBoundingClientRect()
      report.firstSpan = {
        text: firstSpan.textContent,
        style: { left: firstSpan.style.left, top: firstSpan.style.top },
        cssFontHeight: getComputedStyle(firstSpan).getPropertyValue('--font-height').trim(),
        fontSize: getComputedStyle(firstSpan).fontSize,
        rect: [Math.round(r.left), Math.round(r.top), Math.round(r.width), Math.round(r.height)],
        insideCanvas: r.left >= canvasRect.left - 1 && r.top >= canvasRect.top - 1,
      }
    }

    // 2) 跨行选区
    const page2Spans = layers[1] ? [...layers[1].querySelectorAll('span')] : []
    if (page2Spans.length >= 4) {
      const r = document.createRange()
      r.setStart(page2Spans[0].firstChild, 0)
      r.setEnd(page2Spans[3].firstChild, page2Spans[3].textContent.length)
      report.crossLine = { text: r.toString(), rectCount: [...r.getClientRects()].length }
    }

    // 3) 锚点模型：把 Range 换算成「页号 + 页内字符偏移」，再反向解析回来
    //    这正是阅读器要用它替代像素坐标的东西 —— 缩放/重绘后依然成立
    if (page2Spans.length >= 4) {
      const offsets = []
      let acc = 0
      for (const s of page2Spans) { offsets.push(acc); acc += s.textContent.length }
      const start = offsets[0]
      const end = offsets[3] + page2Spans[3].textContent.length
      const parseBack = (() => {
        let idx = 0
        const at = (off) => {
          for (let i = 0; i < page2Spans.length; i++) {
            const len = page2Spans[i].textContent.length
            if (off <= idx + len) return { span: page2Spans[i], offset: off - idx }
            idx += len
          }
          const last = page2Spans[page2Spans.length - 1]
          return { span: last, offset: last.textContent.length }
        }
        const a = at(start), b = at(end)
        const r = document.createRange()
        r.setStart(a.span.firstChild, Math.min(a.offset, a.span.textContent.length))
        r.setEnd(b.span.firstChild, Math.min(b.offset, b.span.textContent.length))
        return r.toString()
      })()
      report.anchor = { page: 2, start, end, resolvedSame: parseBack === report.crossLine.text, resolved: parseBack.slice(0, 60) }
    }

    // 4) 不改 DOM 的高亮：CSS Custom Highlight API
    if (window.CSS && CSS.highlights && page2Spans.length >= 3) {
      const r = document.createRange()
      r.setStart(page2Spans[0].firstChild, 0)
      r.setEnd(page2Spans[2].firstChild, page2Spans[2].textContent.length)
      CSS.highlights.set('spike-hl', new Highlight(r))
      report.customHighlight = { supported: true, rects: [...r.getClientRects()].length }
    } else {
      report.customHighlight = { supported: false }
    }

    // 5) 缩放：textLayer.update 是否保住 DOM 节点（保住了，Range 与高亮就不会失效）
    const before = layers[1].querySelector('span')
    const page2 = await doc.getPage(2)
    const tl2 = new pdfjsLib.TextLayer({
      textContentSource: await page2.getTextContent(),
      container: layers[1],
      viewport: page2.getViewport({ scale: SCALE }),
    })
    await tl2.render()
    const domSpanBefore = layers[1].querySelector('span')
    tl2.update({ viewport: page2.getViewport({ scale: SCALE * 1.6 }) })
    const domSpanAfter = layers[1].querySelector('span')
    report.scaleUpdate = {
      sameNode: domSpanBefore === domSpanAfter,
      leftBefore: domSpanBefore.style.left,
      leftAfter: domSpanAfter.style.left,
      fontSizeBefore: getComputedStyle(domSpanBefore).fontSize,
      fontSizeAfter: getComputedStyle(domSpanAfter).fontSize,
      rangeStillValid: (() => {
        const r = document.createRange()
        try { r.setStart(domSpanAfter.firstChild, 0); r.setEnd(domSpanAfter.firstChild, 3) } catch { return false }
        return r.toString().length === 3
      })(),
    }

    report.ok = report.errors.length === 0
    say('完成')
  } catch (e) {
    report.errors.push(String((e && e.stack) || e))
    say('出错：' + (e && e.message))
  }
  logEl.textContent = JSON.stringify(report, null, 2)
  return report
}
</script>
</body>
</html>
