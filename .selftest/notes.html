<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>译文对照面板 · 独立自测</title>
<style>
  body { margin: 0; font: 13px/1.5 system-ui, sans-serif; background: #eef1f4; }
  #box { width: 380px; height: 620px; background: #fff; margin: 12px; border: 1px solid #dfe3e8; border-radius: 8px; overflow: hidden; }
  #log { margin: 12px; font-family: ui-monospace, monospace; white-space: pre-wrap; }
</style>
</head>
<body>
<div id="box"></div>
<div id="log">waiting…</div>
<script src="/extension/reader-notes.js"></script>
<script>
/**
 * 译文对照面板的独立自测：用一个假的"后台中继"把面板挂起来，
 * 检查渲染、以及每个按钮发出的命令是否正确。
 * 面板是 CoRead 侧栏里的那一块（侧栏本身在无头浏览器里打不开，所以单独测它）。
 */
window.__selftest = async function () {
  const out = { checks: [], errors: [], sent: [] }
  const check = (name, ok, detail) => { out.checks.push({ name, ok: !!ok, detail: detail === undefined ? '' : detail }); return !!ok }

  try {
    const sent = out.sent
    const panel = window.CoReadNotes.mount(document.getElementById('box'), {
      send: async (msg) => { sent.push(msg); return { ok: true } },
      onClose: () => { out.closed = (out.closed || 0) + 1 },
      toast: (t) => { out.lastToast = t },
    })

    // 空状态
    panel.update({ book: { hash: 'h', name: 'sample.pdf' }, entries: [], page: 1, total: 13 })
    check('空状态显示提示', document.querySelector('.rn-empty').hidden === false)
    check('书名与页码显示出来了', /sample\.pdf/.test(document.querySelector('.rn-book').textContent),
      document.querySelector('.rn-book').textContent)

    // 三条：正常 / 翻译中 / 失败
    panel.update({
      book: { hash: 'h', name: 'sample.pdf' }, page: 4, total: 13, activeId: 'b',
      entries: [
        { id: 'a', source: 'Reading foreign literature', translation: '读外文', pending: false, error: '', at: 1 },
        { id: 'b', source: 'means meeting sentences', translation: '', pending: true, error: '', at: 2 },
        { id: 'c', source: 'that do not survive', translation: '', pending: false, error: '模型超时', at: 3 },
      ],
    })
    const items = [...document.querySelectorAll('.rn-item')]
    check('三条都渲染出来', items.length === 3, items.length)
    check('译文显示正常', items[0].textContent.includes('读外文'))
    check('翻译中显示占位', items[1].textContent.includes('翻译中'))
    check('失败显示原因', items[2].textContent.includes('模型超时'))
    check('当前条目带高亮类', items[1].classList.contains('is-active'))
    check('条目数统计正确', document.querySelector('.rn-head').textContent.includes('3 条'))

    // 点原文 → 发 reveal 命令
    sent.length = 0
    items[0].querySelector('.rn-src').click()
    await new Promise((r) => setTimeout(r, 50))
    check('点原文发出 reveal 命令', sent.some((m) => m.action === 'readerCommand' && m.type === 'reveal' && m.id === 'a'),
      JSON.stringify(sent))

    // 设为引用 / 删除
    sent.length = 0
    const byLabel = (label) => [...items[0].querySelectorAll('.rn-acts button')].find((b) => b.textContent === label)
    byLabel('设为引用').click()
    await new Promise((r) => setTimeout(r, 50))
    check('设为引用发出对应命令', sent.some((m) => m.type === 'reference' && m.id === 'a'), JSON.stringify(sent))

    sent.length = 0
    byLabel('删除').click()
    await new Promise((r) => setTimeout(r, 50))
    check('删除发出对应命令', sent.some((m) => m.type === 'remove' && m.id === 'a'), JSON.stringify(sent))

    // 改原文重译：展开编辑框 → 改字 → 重译
    sent.length = 0
    byLabel('改原文重译').click()
    await new Promise((r) => setTimeout(r, 80))
    const ta = document.querySelector('.rn-edit textarea')
    check('展开了原文编辑框', !!ta)
    check('编辑框里是当前原文', !!ta && ta.value === 'Reading foreign literature', ta && ta.value)
    ta.value = 'Reading foreign literature (fixed)'
    const okBtn = [...document.querySelectorAll('.rn-edit-acts button')].find((b) => b.textContent === '重译')
    okBtn.click()
    await new Promise((r) => setTimeout(r, 80))
    const rt = sent.find((m) => m.type === 'retranslate')
    check('重译命令带上了改后的原文', !!(rt && rt.id === 'a' && rt.text === 'Reading foreign literature (fixed)'),
      JSON.stringify(sent))
    check('重译后编辑框收起', !document.querySelector('.rn-edit'))

    // 取消编辑
    byLabel('改原文重译').click()
    await new Promise((r) => setTimeout(r, 60))
    ;[...document.querySelectorAll('.rn-edit-acts button')].find((b) => b.textContent === '取消').click()
    await new Promise((r) => setTimeout(r, 60))
    check('取消后编辑框收起', !document.querySelector('.rn-edit'))

    // 清空 / 关闭
    sent.length = 0
    ;[...document.querySelectorAll('.rn-head button')].find((b) => b.textContent === '清空').click()
    await new Promise((r) => setTimeout(r, 50))
    check('清空发出 clear 命令', sent.some((m) => m.type === 'clear'), JSON.stringify(sent))
    ;[...document.querySelectorAll('.rn-head button')].find((b) => b.textContent.includes('返回')).click()
    check('返回按钮回调了', out.closed === 1, out.closed)

    // 更新为一条 pending：应能覆盖旧内容，不残留
    panel.update({ book: { hash: 'h', name: 'x.pdf' }, entries: [{ id: 'z', source: 's', translation: 't', pending: false, error: '', at: 9 }] })
    check('更新后不残留旧条目', document.querySelectorAll('.rn-item').length === 1,
      document.querySelectorAll('.rn-item').length)
  } catch (e) {
    out.errors.push(String((e && e.stack) || e))
  }

  out.ok = out.errors.length === 0 && out.checks.every((c) => c.ok)
  document.getElementById('log').textContent = JSON.stringify(out, null, 2)
  return out
}
</script>
</body>
</html>
